<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Batch provenance: SweetRun</title>
<meta name="description" content="Maple syrup batch provenance, tracked with SweetRun"/>
<meta name="robots" content="noindex"/>
<!-- chrome:head -->
<meta name="theme-color" content="#0C0B0A" />
  <link rel="icon" type="image/png" sizes="32x32" href="/app/icons/favicon-e-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/app/icons/favicon-e-16.png" />
  <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon-e-180.png" />
  <link rel="preload" href="/app/fonts/barlow-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/app/fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/app/tokens.css" />
  <link rel="stylesheet" href="/calc-shared.css?v=ember" />
<!-- /chrome:head -->
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; }
  .card { width: 100%; max-width: 440px; background: var(--rs-s1); border: 1px solid var(--rs-line); border-radius: 24px; overflow: hidden; }

  /* HEADER */
  .header { position: relative; isolation: isolate; overflow: hidden; padding: 24px; }
  .header > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
  .header::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(12,11,10,.55), rgba(12,11,10,.85)); }
  .header-inner { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-leaf { width: 44px; height: 44px; border-radius: 12px; flex: none; }
  .brand-name { font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1; color: var(--rs-tx); }
  .brand-sub { font: 700 11px/1 var(--rs-fc); letter-spacing: .14em; color: var(--rs-dim); text-transform: uppercase; margin-top: 6px; }
  .batch-pill { background: var(--rs-acc); color: var(--rs-acc-ink); border-radius: 999px; padding: 7px 12px; font-weight: 800; font-size: 13px; white-space: nowrap; }

  /* GRADE BAND */
  .grade-band { padding: 18px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--rs-line); }
  .grade-swatch { width: 48px; height: 48px; border-radius: 14px; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .grade-label { font: 700 11px/1 var(--rs-fc); letter-spacing: .14em; text-transform: uppercase; color: var(--rs-dim); margin-bottom: 6px; }
  .grade-name { font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--rs-tx); }

  /* STATS */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rs-line); border-bottom: 1px solid var(--rs-line); }
  .stats:empty { display: none; }
  .stat { background: var(--rs-s1); padding: 16px 18px; }
  .stat-label { font: 700 11px/1.2 var(--rs-fc); letter-spacing: .12em; text-transform: uppercase; color: var(--rs-dim); margin-bottom: 6px; }
  .stat-val { font-size: 26px; font-weight: 800; color: var(--rs-tx); line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-unit { font-size: 13px; color: var(--rs-dim); margin-top: 4px; }

  /* DETAILS */
  .details { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .detail-row { display: flex; align-items: center; gap: 12px; }
  .detail-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--rs-s3); color: var(--rs-acc); }
  .detail-icon svg { width: 18px; height: 18px; }
  .detail-text { font-size: 15px; color: var(--rs-dim); line-height: 1.4; }
  .detail-text strong { color: var(--rs-tx); }
  .detail-text a { color: var(--rs-tx); text-decoration: underline; text-decoration-color: var(--rs-acc); text-underline-offset: 3px; }
  .detail-fine { font-size: 13px; }

  /* FOOTER */
  .footer { background: var(--rs-bg); border-top: 1px solid var(--rs-line); padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
  .footer-qr { width: 76px; height: 76px; background: #fff; border-radius: 10px; padding: 5px; flex: none; }
  .footer-qr img { width: 100%; height: 100%; display: block; }
  .footer-copy { font-size: 14px; color: var(--rs-dim); line-height: 1.55; }
  .footer-copy a { color: var(--rs-tx); font-weight: 700; text-decoration: underline; text-decoration-color: var(--rs-acc); text-underline-offset: 3px; display: inline-block; padding: 12px 0; }

  /* MISSING */
  .missing { padding: 48px 28px; }
  .missing img { width: 56px; height: 56px; border-radius: 16px; margin-bottom: 20px; }
  .missing h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .missing p { color: var(--rs-dim); }

  /* WATERMARK */
  .watermark { margin-top: 20px; font-size: 14px; color: var(--rs-dim); text-align: center; }
  .watermark a { color: var(--rs-tx); font-weight: 700; text-decoration: underline; text-decoration-color: var(--rs-acc); text-underline-offset: 3px; display: inline-block; padding: 12px 4px; }

  @media print {
    body { background: #fff; padding: 0; }
    .card { border-color: #ccc; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div id="content"></div>
</main>
<div class="watermark">Tracked with <a href="https://sweetrun.app">sweetrun.app</a></div>

<script>
const GRADES = {
  golden: { name:'Golden Delicate', color:'#EDE3C8', bg:'rgba(237,227,200,0.10)' },
  amber:  { name:'Amber Rich',      color:'#E3B45E', bg:'rgba(227,180,94,0.10)' },
  dark:   { name:'Dark Robust',     color:'#A8712F', bg:'rgba(168,113,47,0.12)' },
  vdark:  { name:'Very Dark Strong',color:'#5E3A1C', bg:'rgba(94,58,28,0.18)'  },
};

const ICON = {
  date: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  loc:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    batch:  p.get('b')   || '',
    date:   p.get('d')   || '',
    grade:  p.get('g')   || '',
    sap:    p.get('sap') || '',
    syrup:  p.get('syr') || '',
    loc:    p.get('loc') || '',
    taps:   p.get('taps')|| '',
    season: p.get('s')   || '',
    notes:  p.get('n')   || '',
    units:  p.get('u')   || 'gal',
  };
}

function formatDate(d) {
  if (!d) return '';
  try {
    const dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  } catch { return d; }
}

function ratio(sap, syr) {
  const s = parseFloat(sap), y = parseFloat(syr);
  if (!s || !y) return null;
  return (s / y).toFixed(1) + ':1';
}

function render(q) {
  const grade = GRADES[q.grade] || null;
  const batchLabel = q.batch ? `Batch #${esc(q.batch)}` : 'Batch';
  const dateLabel  = formatDate(q.date);
  const r = ratio(q.sap, q.syrup);
  const u = q.units === 'L' ? 'L' : 'gal';

  if (!q.batch && !q.date && !q.grade) {
    document.getElementById('content').innerHTML = `
      <div class="missing">
        <img src="/app/icons/icon-e-192.png" width="56" height="56" alt=""/>
        <h1>No batch data</h1>
        <p>This link doesn't contain batch information. Generate a label from the SweetRun app to create a valid provenance link.</p>
      </div>`;
    return;
  }

  const batchPageUrl = window.location.href;

  document.getElementById('content').innerHTML = `
    <div class="header">
      <img class="bg" src="/app/photos/syrup-bottles.webp" alt="" width="1200" height="670"/>
      <div class="header-inner">
        <div class="brand">
          <img class="brand-leaf" src="/app/icons/icon-e-192.png" width="44" height="44" alt=""/>
          <div>
            <h1 class="brand-name">SweetRun</h1>
            <div class="brand-sub">Maple Provenance</div>
          </div>
        </div>
        <div class="batch-pill">${batchLabel}${q.season ? ' · ' + esc(q.season) : ''}</div>
      </div>
    </div>

    ${grade ? `
    <div class="grade-band" style="background:${grade.bg}">
      <div class="grade-swatch" style="background:${grade.color}"></div>
      <div>
        <div class="grade-label">USDA Grade A</div>
        <div class="grade-name">${grade.name}</div>
      </div>
    </div>` : ''}

    <div class="stats">
      ${q.sap ? `<div class="stat">
        <div class="stat-label">Sap Collected</div>
        <div class="stat-val">${parseFloat(q.sap).toLocaleString()}</div>
        <div class="stat-unit">${u}</div>
      </div>` : ''}
      ${q.syrup ? `<div class="stat">
        <div class="stat-label">Syrup Produced</div>
        <div class="stat-val">${parseFloat(q.syrup).toFixed(1)}</div>
        <div class="stat-unit">${u}</div>
      </div>` : ''}
      ${r ? `<div class="stat">
        <div class="stat-label">Sap-to-Syrup Ratio</div>
        <div class="stat-val">${r}</div>
        <div class="stat-unit">gallons sap per gallon syrup</div>
      </div>` : ''}
      ${q.taps ? `<div class="stat">
        <div class="stat-label">Trees Tapped</div>
        <div class="stat-val">${parseInt(q.taps).toLocaleString()}</div>
        <div class="stat-unit">maple trees</div>
      </div>` : ''}
    </div>

    <div class="details">
      ${dateLabel ? `<div class="detail-row">
        <div class="detail-icon">${ICON.date}</div>
        <div class="detail-text">Boiled <strong>${esc(dateLabel)}</strong></div>
      </div>` : ''}
      ${q.loc ? `<div class="detail-row">
        <div class="detail-icon">${ICON.loc}</div>
        <div class="detail-text">Sugarbush in <strong>${esc(q.loc)}</strong></div>
      </div>` : ''}
      ${q.notes ? `<div class="detail-row">
        <div class="detail-icon">${ICON.note}</div>
        <div class="detail-text">${esc(q.notes)}</div>
      </div>` : ''}
      <div class="detail-row">
        <div class="detail-icon">${ICON.lock}</div>
        <div class="detail-text detail-fine">Batch data encoded right in this QR by the producer, tracked with <a href="https://sweetrun.app">SweetRun</a>.</div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div class="footer-qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent('https://sweetrun.app')}&color=0C0B0A&bgcolor=ffffff" alt="QR code for sweetrun.app"/>
        </div>
      </div>
      <div class="footer-copy">
        Want to track your own sugarbush?<br/>
        <a href="https://sweetrun.app">sweetrun.app</a>: 14 days free, then $49.99 a year
      </div>
    </div>
  `;
}

render(parseParams());
</script>
</body>
</html>
