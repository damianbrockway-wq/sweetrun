    /* ── FIELD tokens ─────────────────────────────────────────────────────
       The design system for SweetRun, in one place. Colours, a five-step
       type scale that bottoms out at 12px (below that a number is not
       readable on a phone in a sugarbush), radii, and a 4px spacing step.
       Inline styles through the app are being migrated onto these; new work
       should use them rather than a fresh hex or pixel value. */
    :root {
      --c-bg:#07090f; --c-surface:#0f1720; --c-inset:#0d1a2b;
      --c-line:#131e2c; --c-edge:#1e2d3d;
      --c-text:#e6edf3; --c-dim:#7f92a6; --c-muted:#7f92a6;
      --c-brand:#2dd4a7; --c-flow:#3fb950; --c-output:#e0a44a;
      --c-info:#58a6ff; --c-danger:#f85149;
      --t-label:12px; --t-sub:14px; --t-body:16px; --t-title:20px; --t-figure:28px;
      --r-control:10px; --r-card:16px; --r-pill:999px;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
      --tap:44px; --w-date:64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090f;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    input, select, textarea {
      background: #0f1720;
      border: 1px solid #1e2d3d;
      color: #e6edf3;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: #2dd4a7;
      box-shadow: 0 0 0 3px rgba(45,212,167,0.12);
    }
    select { appearance: none; cursor: pointer; }
    button { cursor: pointer; font-family: inherit; }
    ::placeholder { color: var(--c-dim); opacity: 1; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 3px; }
    .card {
      background: var(--c-surface);
      border: 1px solid var(--c-edge);
      border-radius: var(--r-card);
      padding: 16px;
      margin-bottom: 12px;
    }
    .result-box {
      background: var(--c-inset);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 12px;
    }
    .result-box.orange, .result-box.blue, .result-box.green, .result-box.purple { background: var(--c-inset); }
    .result-label {
      font-size: var(--t-label);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: var(--c-muted);
    }
    .result-value {
      font-size: var(--t-figure);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .result-value .unit { font-size: 13px; font-weight: 500; color: var(--c-muted); margin-left: 4px; letter-spacing: 0; }
    .result-sub { font-size: 12px; margin-top: 4px; color: var(--c-muted); }
    .two-col   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .field-label { font-size: 12px; color: var(--c-muted); font-weight: 600; margin-bottom: 7px; letter-spacing: 0.01em; }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card-icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--c-dim);
    }
    .tab-content { max-width: 520px; margin: 0 auto; padding: 16px 14px 90px; }
    .progress-bar-bg { background: #131e2c; border-radius: 6px; height: 7px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
    .checklist-item {
      display: flex; align-items: center; gap: 13px;
      padding: 14px 18px;
      border-bottom: 1px solid #131e2c;
      cursor: pointer;
      transition: background 0.12s;
    }
    .checklist-item:hover { background: rgba(255,255,255,0.02); }
    .checklist-item:last-child { border-bottom: none; }
    .checkbox {
      width: 23px; height: 23px; border-radius: 50%;
      border: 2px solid #253040; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.18s;
    }
    .checkbox.checked {
      background: var(--c-brand);
      border-color: var(--c-brand);
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 14px;
      background: var(--c-inset);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .btn-primary {
      background: var(--c-brand);
      color: #07090f;
      border: none; border-radius: var(--r-control);
      padding: 14px 20px; font-size: 15px; font-weight: 700;
      width: 100%;
      transition: background 0.12s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      letter-spacing: -0.1px;
    }
    .btn-primary:hover { background: #3ee0b4; }
    .btn-secondary {
      background: var(--c-surface); color: #e6edf3;
      border: 1px solid var(--c-edge); border-radius: var(--r-control);
      padding: 12px 20px; min-height: 44px; font-size: 15px; font-weight: 600;
      width: 100%; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-secondary:hover { background: #141f2e; border-color: #28405a; }
    .btn-icon {
      width: 44px; height: 44px; border-radius: var(--r-control);
      border: none; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #07090f;
    }
    .log-entry {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; border-bottom: 1px solid #131e2c; font-size: 14px;
    }
    .log-entry:last-child { border-bottom: none; }
    .badge {
      background: var(--c-inset);
      color: #e6edf3;
      font-size: 13px; font-weight: 800;
      padding: 3px 10px; border-radius: 20px;
      letter-spacing: 0.02em;
    }
    .section-header {
      font-size: var(--t-label); font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--c-muted);
      display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
    }
    /* ── Design tokens ── */
    /* Canonical muted text: use --c-muted (dim labels) or --c-hint (very dim) */
    :root {
      --c-hint:   #7f92a6;   /* tertiary / placeholder text — same grey as --c-muted; two greys, not three */
      --c-subtle: #7f92a6;   /* medium-weight secondary values */
      --c-border: #1e2d3d;
    }
    /* Disabled state */
    button:disabled { cursor: not-allowed; opacity: 0.4; }
    /* Consistent empty state */
    .empty-state {
      text-align: center; padding: 28px 20px;
      color: var(--c-hint); font-size: 13px; line-height: 1.6;
    }
    .empty-state .empty-icon { display: none; }
    .empty-state .empty-title { font-size: 14px; font-weight: 700; color: var(--c-text); margin-bottom: 4px; }
    /* Consistent inner row (replaces info-row variants) */
    .data-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--c-inset);
      border-radius: 10px; margin-bottom: 6px;
      font-size: 13px;
    }
    .data-row .data-label { color: var(--c-muted); }
    .data-row .data-value { font-weight: 600; color: var(--c-text); }
    /* tip-item text standardised */
    .tip-item { color: #7f92a6; }
    .divider { height: 1px; background: #131e2c; margin: 8px 0 14px; }
    .weather-day {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; background: var(--c-inset);
      border-radius: 10px; margin-bottom: 6px; font-size: 14px;
    }
    .good-badge  { background: rgba(63,185,80,0.14); color: #3fb950; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 12px; }
    .freeze-badge { background: rgba(255,255,255,0.06); color: #7f92a6; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 12px; }
    .tip-item {
      display: flex; align-items: flex-start; gap: 11px;
      padding: 11px 14px; background: var(--c-inset);
      border-radius: 10px; margin-bottom: 6px; font-size: 14px; line-height: 1.5; color: #b0bec8;
    }
    .tip-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--c-brand); margin-top: 6px; flex-shrink: 0;
    }
    .collapsible-header {
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; padding: 4px 0;
    }
    .equip-item {
      background: var(--c-inset); border-radius: 12px;
      padding: 14px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .delete-btn {
      background: none; border: none; width: 44px; height: 44px; margin: -10px -12px -10px 0;
      color: var(--c-danger); display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; border-radius: 10px;
    }
    .delete-btn:hover { background: rgba(248,81,73,0.12); }
    .onboarding-card {
      background: var(--c-surface);
      border: 1px solid var(--c-edge);
      border-radius: var(--r-card); padding: 16px; margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .dot { width: 22px; height: 4px; border-radius: 3px; background: var(--c-edge); }
    .dot.active { background: var(--c-brand); }
    input[type="number"] { -moz-appearance: textfield; }
    /* ── Bottom destination bar ──────────────────────────────────────────
       Five targets across 390px is 78px each, which clears the 44px minimum
       with room for a label. Fixed, because the top of a phone is not where a
       thumb lives. */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
      display: flex; align-items: stretch;
      background: var(--c-bg);
      border-top: 1px solid var(--c-line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bnav-btn {
      flex: 1 1 0; min-width: 0; min-height: 56px;
      background: none; border: none; border-top: 2px solid transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--c-muted); font-size: var(--t-label); font-weight: 600; letter-spacing: 0.01em;
      padding: 7px 2px 8px; cursor: pointer; transition: color .15s, border-color .15s;
    }
    .bnav-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .bnav-btn:hover { color: var(--c-dim); }
    .bnav-btn.active { color: var(--c-brand); border-top-color: var(--c-brand); }
    .bnav-btn:focus-visible { outline: 2px solid var(--c-brand); outline-offset: -3px; }
    /* Content clears the bar */
    .app-main { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
    html { scroll-padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    /* One primary action per screen, in flow, 24px under the last card */
    .primary-bar { margin: 24px 0 0; }
    .hit44 { position: relative; }
    .hit44::after { content: ''; position: absolute; inset: -4px; }
    .today-fill { display: flex; flex-direction: column; min-height: calc(100vh - 176px - env(safe-area-inset-bottom, 0px)); }
    .today-fill .primary-bar { margin-top: auto; padding-top: 24px; }
    .primary-bar .btn-primary { min-height: 52px; font-size: 16px; }
    /* One three-column grid for every stat row */
    .stat3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; column-gap: 12px; row-gap: 4px; align-items: baseline; }
    /* The figure treatment, as classes (Today built it inline; Log uses the same numbers) */
    .eyebrow { font-size: 12px; font-weight: 700; color: var(--c-muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .fig { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
    .fig .v { font-size: 20px; font-weight: 700; color: var(--c-text); line-height: 1.05; letter-spacing: -0.01em; white-space: nowrap; }
    .fig.lead .v { font-size: var(--t-figure); font-weight: 800; color: var(--c-brand); }
    .fig .u { font-size: 13px; color: var(--c-muted); font-weight: 500; }
    /* The Log: entries on hairlines, no cards */
    .log-row { display: grid; grid-template-columns: var(--w-date) 1fr auto; column-gap: 10px; align-items: baseline; min-height: 48px; padding: 10px 0; border-bottom: 1px solid var(--c-line); font-size: 14px;
      width: 100%; background: none; border-top: none; border-left: none; border-right: none; color: var(--c-text); font-family: inherit; text-align: left; cursor: pointer; border-radius: 0; }
    .log-date { color: var(--c-muted); white-space: nowrap; }
    .log-kind { color: var(--c-text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-chip { display: inline-block; font-size: 12px; font-weight: 700; color: var(--c-dim); background: rgba(255,255,255,0.06); border-radius: 6px; padding: 1px 7px; margin-left: 8px; vertical-align: 1px; }
    .log-chip.amber { color: var(--c-output); background: rgba(224,164,74,0.13); }
    .log-note { color: var(--c-muted); margin-left: 8px; font-size: 13px; }
    .log-amt { font-weight: 700; text-align: right; white-space: nowrap; }
    .log-amt .u { font-weight: 500; color: var(--c-muted); }
    /* The sheet's footer stays in view above the keyboard; the body scrolls */
    .sheet-form { padding-bottom: 0; overscroll-behavior: contain; scroll-padding-bottom: 140px; }
    .sheet-foot { position: sticky; bottom: 0; background: #0d1521; padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); margin-top: 4px; }
    .sheet-delete { width: 100%; min-height: 44px; background: none; border: none; color: var(--c-muted); font-size: 14px; font-weight: 600; cursor: pointer; }
    .sheet-delete.armed { color: var(--c-danger); }
    .more-row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 2px; margin-top: 4px; background: none; border: none; border-bottom: 1px solid var(--c-line); color: var(--c-text); font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; }
    .more-row .sub { flex: 1; font-size: 13px; font-weight: 400; color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .primary-bar.pinned { position: fixed; left: 14px; right: 14px; z-index: 250; margin: 0; max-width: 512px; margin: 0 auto;
      bottom: calc(72px + env(safe-area-inset-bottom, 0px) + 12px); }
    /* The entry sheet */
    .picker { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: var(--c-surface); border: 1px solid var(--c-edge); border-radius: 10px; padding: 3px; }
    .seg { min-height: 44px; border: none; border-radius: 8px; background: transparent; color: var(--c-dim); font-size: 13px; font-weight: 700; padding: 0 2px; white-space: nowrap; cursor: pointer; }
    .seg.on { background: rgba(45,212,167,0.16); color: var(--c-brand); }
    .amount { position: relative; margin-bottom: 14px; }
    .amount input { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; padding: 10px 56px 10px 14px; height: 64px; text-align: right; }
    .amount .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: 500; color: var(--c-muted); pointer-events: none; }
    .select-wrap { position: relative; }
    .select-wrap select { padding-right: 40px; }
    .select-wrap svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .sheet .two-col { margin-bottom: 14px; }
    .sheet-cancel { width: 100%; min-height: 44px; background: none; border: none; color: var(--c-dim); font-size: 15px; font-weight: 600; margin-top: 4px; cursor: pointer; }
    html { scroll-padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    /* The map is the figure: a full-bleed stage with one floating cluster */
    .map-stage { position: relative; margin: 0 -14px; background: var(--c-surface); overflow: hidden; }
    .map-cluster { position: absolute; right: 12px; top: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    /* Tactical HUD chrome: the floating instruments are glass — dark, blurred, teal-edged */
    .mfab { width: 44px; height: 44px; border-radius: 50%; background: rgba(13,21,33,0.72);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border: 1px solid rgba(45,212,167,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: center; color: var(--c-text); cursor: pointer; padding: 0; }
    .mfab.on { color: var(--c-brand); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 12px rgba(45,212,167,0.35); }
    .mfab.rec { color: var(--c-danger); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 12px rgba(248,81,73,0.35); }
    .mfab:disabled { color: var(--c-muted); cursor: default; }
    .mfab:focus-visible { outline: 2px solid var(--c-brand); outline-offset: 2px; }
    .map-add { position: absolute; left: 12px; bottom: 12px; z-index: 1000; min-height: 44px; border-radius: 999px; border: none;
      background: var(--c-brand); color: #07090f; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
      box-shadow: 0 2px 14px rgba(45,212,167,0.30); }
    .map-add:focus-visible { outline: 2px solid var(--c-text); outline-offset: 2px; }
    .map-toast { position: absolute; left: 12px; right: 64px; bottom: 68px; z-index: 1000; background: rgba(13,21,33,0.78);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border: 1px solid rgba(45,212,167,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--c-text); }
    /* Slim top status strip: pin count · GPS · active layer — instrument caps */
    .map-hud { position: absolute; top: 12px; left: 68px; right: 68px; z-index: 1000; display: flex; justify-content: center; pointer-events: none; }
    .map-hud-inner { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; overflow: hidden; white-space: nowrap;
      background: rgba(13,21,33,0.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border: 1px solid rgba(45,212,167,0.25); border-radius: 999px; padding: 5px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 2px 10px rgba(0,0,0,0.35);
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-muted); }
    .map-hud-inner b { font-weight: 800; color: #e6edf3; letter-spacing: 0.08em;
      font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
    .map-hud-inner .sep { color: rgba(45,212,167,0.5); }
    /* Inner vignette: imagery reads as a viewport, not wallpaper. Sits above tiles/markers, below popups and controls. */
    .map-stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 650; border-radius: inherit;
      box-shadow: inset 0 0 64px 8px rgba(0,0,0,0.42); }
    .pick-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 10px;
      background: none; border: none; color: var(--c-text); font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; }
    .pick-row.on { background: rgba(45,212,167,0.16); color: var(--c-brand); }
    /* Horizontal scroll rows: momentum, no bar, an edge fade and room at the end */
    .hscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
    .hscroll::-webkit-scrollbar { display: none; }
    .hscroll > *:last-child { margin-right: 16px; }
    /* Leaflet chrome on the FIELD ground */
    .leaflet-bar { border: none !important; border-radius: 0 !important; box-shadow: none !important; background: none !important; display: flex; flex-direction: column; gap: 8px; }
    .leaflet-touch .leaflet-bar a, .leaflet-bar a { width: 44px !important; height: 44px !important; line-height: 44px !important; border-radius: 50% !important;
      background: rgba(13,21,33,0.72) !important; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      color: var(--c-text) !important; border: 1px solid rgba(45,212,167,0.25) !important; font-size: 20px; font-weight: 600; box-sizing: border-box; }
    .leaflet-bar a:focus-visible { outline: 2px solid var(--c-brand); outline-offset: 2px; }
    .leaflet-left .leaflet-control { margin-left: 12px !important; } .leaflet-top .leaflet-control { margin-top: 12px !important; }
    .leaflet-bottom { bottom: 8px; }
    .leaflet-bar a:hover { background: var(--c-inset) !important; }
    .leaflet-bar a:active { background: var(--c-inset) !important; color: var(--c-brand) !important; opacity: 1; }
    .leaflet-bar a.leaflet-disabled { color: var(--c-muted) !important; background: var(--c-surface) !important; }
    .leaflet-container .leaflet-control-attribution { background: rgba(15,23,32,0.9) !important; color: var(--c-muted) !important; font-size: 12px; padding: 2px 8px; border-radius: 6px 0 0 0; }
    .leaflet-container .leaflet-control-attribution a { color: var(--c-dim) !important; }
    @media (prefers-reduced-motion: reduce) { .bnav-btn { transition: none; } }
    /* Single-row scrollable tab bar */
    .tab-bar-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 2px 6px;
      margin: 0 -2px;
    }
    .tab-bar-wrap::-webkit-scrollbar { display: none; }
    .tab-bar { display: flex; gap: 2px; min-width: max-content; }
    .tab-btn {
      flex-shrink: 0;
      background: transparent;
      color: var(--c-muted);
      border: none; border-bottom: 2px solid transparent; border-radius: 0;
      padding: 12px 12px 10px; min-height: 44px; justify-content: center;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
      transition: color 0.15s, border-color 0.15s;
      min-width: 54px;
    }
    .tab-btn:hover { color: var(--c-dim); }
    .tab-btn.active { color: var(--c-text); font-weight: 700; }
    .tab-btn:not(.active) { font-weight: 600; }
    .tab-btn:focus-visible { outline: 2px solid var(--c-brand); outline-offset: -2px; }
    /* Pressed state — every control confirms the tap the same way */
    button:not(:disabled):active, [role=tab]:active, .checklist-item:active, .collapsible-header:active { opacity: 0.7; transition: opacity 80ms; }
    /* One sheet treatment for every sheet */
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 1000;
      display: flex; align-items: flex-end; justify-content: center; animation: scrimIn 200ms ease-out both; }
    .sheet { background: #0d1521; border-top: 1px solid var(--c-edge); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
      padding: 12px 14px calc(28px + env(safe-area-inset-bottom, 0px));
      animation: sheetUp 240ms cubic-bezier(.2,.8,.2,1) both; }
    .sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 16px; }
    @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none; } button:not(:disabled):active { transition: none; } }
    /* ── Weather Tab ── */
    .wx-score-col {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--c-edge);
      border-radius: 10px;
      padding: 8px 4px;
      cursor: pointer;
      transition: all 0.15s;
      background: transparent;
      min-width: 42px;
    }
    .wx-score-col:hover { border-color: var(--c-edge); background: rgba(255,255,255,0.03); }
    .wx-factor-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--c-line);
    }
    .wx-factor-row:last-child { border-bottom: none; }
    .wx-geo-result {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      padding: 9px 12px;
      color: #e6edf3;
      font-size: 13px;
      cursor: pointer;
    }
    .wx-geo-result:hover { background: #2d333b; }

    /* ── Responsive layout ────────────────────────────────────────────── */

    /* Header controls must wrap on every phone, not just desktop */
    .app-header-controls { flex-wrap: wrap; row-gap: 6px; max-width: 100%; }
    html, body, .app-wrap { overflow-x: hidden; }

    /* Tablet: widen the single-column layout */
    @media (min-width: 768px) {
      .app-wrap   { max-width: 820px !important; }
      .app-header { max-width: 820px !important; }
      .tab-content { max-width: 820px; padding-left: 20px; padding-right: 20px; }
    }

    /* Desktop sidebar nav: exists in the DOM at every width, shown only ≥1024px.
       Below that, mobile keeps the bottom destination bar + horizontal sub-tabs
       exactly as before. */
    .side-nav { display: none; }

    /* Desktop: sidebar navigation + wide content */
    @media (min-width: 1024px) {
      .bottom-nav { display: none; }
      .app-main { padding-bottom: 0; }

      .side-subs { display: flex; flex-direction: column; margin: 2px 0 6px; }

    /* Large desktop: even more breathing room */
    @media (min-width: 1400px) {
      .app-wrap { max-width: 1440px !important; }
      .tab-content { padding: 24px 40px 40px !important; }

    /* ── Print / Export CSS ────────────────────────────── */
    @media print {

  <style>
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @keyframes sagePulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px #3fb95080; }
      50%       { opacity: 0.5; box-shadow: 0 0 14px #3fb950cc; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes barFill {
      from { width: 0%; }
      to   { width: var(--bar-width); }
    }
    .sage-pulse { animation: sagePulse 2.5s ease-in-out infinite; }
    .sage-fadein { animation: fadeIn 0.4s ease both; }
    .shimmer-line {
      background: linear-gradient(90deg, #1e2d3d 25%, #2d4a6a 50%, #1e2d3d 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* ── Map: sensor-grade effects (presentation only; all killed under reduced-motion) ── */
    /* Soft glow underlay beneath route polylines (a wider blurred stroke of the same grade colour) */
    .sr-line-glow { filter: blur(5px); }
    /* Sap flow: an animated dash sliding from→to. The analysis builds segments
       high→low, so path direction IS downhill; only ≥1% grade segments get this. */
    .sr-flow-dash { animation: srFlow 1.5s linear infinite; }
    @keyframes srFlow { to { stroke-dashoffset: -22; } }
    /* One-sweep radar scan across the viewport when Analyze Routes runs */
    .sr-scan { position: absolute; inset: 0; z-index: 850; pointer-events: none; overflow: hidden; }
    .sr-scan::before { content: ""; position: absolute; left: 50%; top: 50%; width: 280%; padding-top: 280%;
      margin: -140% 0 0 -140%; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(45,212,167,0) 0deg 295deg, rgba(45,212,167,0.10) 330deg, rgba(45,212,167,0.45) 358deg, rgba(45,212,167,0.55) 360deg);
      animation: srSweep 1.2s cubic-bezier(.45,.05,.35,1) 1 both; }
    @keyframes srSweep { 0% { transform: rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: rotate(360deg); opacity: 0; } }
    /* Results panels slide-fade in (staggered via inline animation-delay) */
    .sr-rise { animation: srRise 0.32s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes srRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    /* Fine scanline for loading states (no spinners) */
    .sr-scanline { position: relative; overflow: hidden; height: 2px; border-radius: 1px; background: rgba(45,212,167,0.12); }
    .sr-scanline::after { content: ""; position: absolute; top: 0; left: 0; width: 38%; height: 100%; border-radius: 1px;
      background: linear-gradient(90deg, transparent, var(--c-brand), transparent);
      animation: srScanline 1.1s linear infinite; }
    @keyframes srScanline { from { transform: translateX(-100%); } to { transform: translateX(365%); } }
    /* Selected pin: one expanding teal pulse ring, centred on the trunk foot */
    .sr-pulse { position: absolute; left: 50%; bottom: -15px; margin-left: -17px; width: 34px; height: 34px;
      border-radius: 50%; border: 2px solid var(--c-brand); opacity: 0; pointer-events: none;
      animation: srPulse 1.8s cubic-bezier(.25,.6,.4,1) infinite; }
    @keyframes srPulse { 0% { transform: scale(0.35); opacity: 0.8; } 70%, 100% { transform: scale(1.5); opacity: 0; } }
    /* New pin drop: 250ms scale-settle on the marker's inner wrapper (Leaflet owns the icon element's transform) */
    .sr-drop { animation: srSettle 250ms cubic-bezier(.2,.9,.3,1.15) both; transform-origin: 50% 95%; }
    @keyframes srSettle { from { transform: scale(0.55) translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
    /* Top-ranked Tank Spot: static amber glow */
    .sr-spot-top { filter: drop-shadow(0 3px 8px rgba(0,0,0,0.6)) drop-shadow(0 0 8px rgba(235,154,51,0.75)) !important; }

    /* ── Pass 4: terrain layer + Layers panel + measure tool (static styles, nothing animated) ── */
    /* Hillshade pane above the imagery tiles — multiply carves the relief through the canopy */
    .sr-terrain-pane { mix-blend-mode: multiply; }
    /* Terrain-only base: warm the clinical-gray hillshade toward the brand's gray-green */
    .sr-terrain-tint { filter: sepia(0.45) hue-rotate(55deg) saturate(0.55) brightness(0.85); }
    /* Layers panel: the glass sheet variant */
    .sheet-glass { background: rgba(13,21,33,0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(45,212,167,0.25); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); }
    .ly-cap { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--c-muted); margin: 12px 2px 6px; }
    .ly-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px;
      border-radius: 12px; background: transparent; border: 1px solid transparent; color: var(--c-text);
      cursor: pointer; text-align: left; font: inherit; }
    .ly-row.on { background: rgba(45,212,167,0.10); border-color: rgba(45,212,167,0.35); }
    .ly-row:focus-visible { outline: 2px solid var(--c-brand); outline-offset: 2px; }
    .ly-thumb { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; position: relative;
      flex-shrink: 0; background: #0d1a2b; border: 1px solid rgba(255,255,255,0.08); display: block; }
    .ly-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .ly-thumb img.blend { mix-blend-mode: multiply; opacity: 0.55; }
    .ly-thumb img.tint { filter: sepia(0.45) hue-rotate(55deg) saturate(0.55) brightness(0.85); }
    .ly-thumb img.half { clip-path: inset(0 0 0 50%); }
    .ly-name { display: block; font-size: 14.5px; font-weight: 700; }
    .ly-sub { display: block; font-size: 12px; color: var(--c-muted); margin-top: 1px; }
    .ly-slider { display: flex; align-items: center; gap: 10px; margin: 2px 10px 8px 66px; }
    .ly-slider input[type=range] { flex: 1; accent-color: var(--c-brand); min-height: 28px; }
    /* Measure tool: glass readout panel, amber tape language */
    .map-measure { position: absolute; left: 12px; right: 64px; bottom: 12px; z-index: 1000;
      background: rgba(13,21,33,0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(235,154,51,0.35); border-radius: 14px; padding: 10px 12px; color: var(--c-text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 16px rgba(0,0,0,0.4); }
    .mm-cap { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-muted); }
    .mm-val { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;

    .mm-alt { font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
      font-variant-numeric: tabular-nums; font-size: 12px; color: var(--c-muted); }
    .mm-chip { min-height: 32px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);

    @media (prefers-reduced-motion: reduce) {
      .sr-flow-dash { animation: none; display: none; }

      .sr-drop { animation: none; }
    }
  </style>
</head>

<script>
// ── PWA Service Worker ─────────────────────────────────────────────────────────
// Registers /app/sw.js — handles caching, offline support, and cache versioning.
// localStorage data (all sg_* keys) is NEVER touched by the service worker.
// To force all users to get the latest app: bump CACHE name in app/sw.js.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' })
    .then(reg => {
      console.log('[SweetRun] SW registered, scope:', reg.scope);
      // Check for a waiting SW update and activate it immediately
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // New version available — activate without requiring a user refresh
            newSW.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    })
    .catch(err => console.warn('[SweetRun] SW registration failed:', err));

  // When a new SW takes over, reload to get the latest app shell
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
}
</script>
