<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SweetRun</title>
  <meta name="description" content="Maple production, one season at a time: what to do next, and a log of every gallon." />
  <meta name="theme-color" content="#0C0B0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SweetRun" />
  <!-- Home screen icon: option E, Damian's own (brand/icon-options/). The letter is
       in every file name so a year-long cache can never serve a previous icon. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/app/icons/apple-touch-icon-e-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/app/icons/favicon-e-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/app/icons/favicon-e-16.png" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="stylesheet" href="/app/tokens.css" />
  <link rel="stylesheet" href="/app/runsheet.css" />
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- jsPDF (356 KB) and Leaflet load on demand (PDF export, the Bush tab), not in the head. -->
</head>
<body>
<div id="root"></div>
<script src="/app/app.js"></script>

<script>
// ── PWA Service Worker ─────────────────────────────────────────────────────────
// Registers /app/sw.js — handles caching, offline support, and cache versioning.
// localStorage data (all sg_* keys) is NEVER touched by the service worker.
// To force all users to get the latest app: bump CACHE name in app/sw.js.
// Registered after the page has loaded, so the precache (photos, fonts, jsPDF, Leaflet)
// never competes with the first paint for bandwidth.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // A page that opened with no worker in control is the first visit: the new worker's
  // clients.claim() fires controllerchange, and reloading then would restart the app
  // mid-use for nothing. Reload only when an older worker was replaced.
  const hadController = !!navigator.serviceWorker.controller;
  const register = () => navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' })
    .then(reg => {
      console.log('[SweetRun] SW registered, scope:', reg.scope);
      // Check for a waiting SW update and activate it immediately
      if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            // New version available — activate without requiring a user refresh
            newSW.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    })
    .catch(err => console.warn('[SweetRun] SW registration failed:', err));
  if (document.readyState === 'complete') register(); else window.addEventListener('load', register, { once: true });

  // When a new SW replaces an old one, reload to get the latest app shell
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || refreshing) return;
    refreshing = true; window.location.reload();
  });
}
</script>
</body>
</html>
