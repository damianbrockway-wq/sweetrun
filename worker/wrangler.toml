name = "sweetrun-license"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Create the namespace first:  npx wrangler kv namespace create DATA
# ...then paste the id it prints below.
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
WEB3FORMS_KEY = "d91810ec-94aa-49ed-9731-6ba2cd42e106"
NOTIFY_EMAIL = "damian.brockway@gmail.com"

# Secrets (run each once):
#   npx wrangler secret put LICENSE_SIGNING_KEY   ← paste value from worker/.dev.vars
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET ← from Stripe dashboard webhook config
#   npx wrangler secret put ADMIN_KEY             ← any random string you choose
